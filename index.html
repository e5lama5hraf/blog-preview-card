<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- displays site properly based on user's device -->

  <link rel="icon" type="image/png" sizes="32x32" href="./assets/images/favicon-32x32.png">

  <title>Blog preview card | Frontend Mentor</title>
  <link rel="stylesheet" href="style.css">

</head>

<body>

  <main class="card">
    <img class="card__image" src="assets/images/illustration-article.svg" alt="">
    <div class="card__content">
      <span class="content__category">Learning</span>
      <p class="content__date">Published 21 Dec 2023</p>
      <h1 class="content__title"><a href="#">HTML & CSS foundations</a></h1>
      <p class="content__description">These languages are the backbone of every website, defining structure, content, and presentation.</p>
    </div>
    <div class="author">
      <img class="author__pic" src="assets/images/image-avatar.webp" alt="">
      <p class="author__name">Greg Hooper</p>
    </div>
  </main>

  <footer class="attribution">
    Challenge by <a href="https://www.frontendmentor.io?ref=challenge">Frontend Mentor</a>.
    Coded by <a href="https://github.com/e5lama5hraf">Eslam Ashraf</a>.
  </footer>
</body>

</html>
